name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Spanish installer
        working-directory: installer
        run: python -m PyInstaller --onefile --console --name actual-metar --add-data "../lua/actual_metar;actual_metar" --add-data "../luasec_payload;luasec" --distpath ./dist --workpath ./build --specpath . installer.py

      - name: Build English installer
        working-directory: installer
        run: python -m PyInstaller --onefile --console --name actual-metar-en --add-data "../lua_en/actual_metar;actual_metar" --add-data "../luasec_payload;luasec" --distpath ./dist --workpath ./build_en --specpath . installer_en.py

      - name: Package distribution zips
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging/Instalacion-ES, staging/Installation-EN | Out-Null

          Copy-Item installer/dist/actual-metar.exe staging/Instalacion-ES/actual-metar.exe
          Copy-Item README.es.md staging/Instalacion-ES/README.md
          Copy-Item DEVELOPMENT.md staging/Instalacion-ES/DEVELOPMENT.md
          Copy-Item luasec_payload/ATTRIBUTION.txt staging/Instalacion-ES/LUASEC_ATTRIBUTION.txt

          Copy-Item installer/dist/actual-metar-en.exe staging/Installation-EN/actual-metar.exe
          Copy-Item README.md staging/Installation-EN/README.md
          Copy-Item DEVELOPMENT.en.md staging/Installation-EN/DEVELOPMENT.md
          Copy-Item luasec_payload/ATTRIBUTION.txt staging/Installation-EN/LUASEC_ATTRIBUTION.txt

          Compress-Archive -Path staging/Instalacion-ES/* -DestinationPath Instalacion-ES.zip
          Compress-Archive -Path staging/Installation-EN/* -DestinationPath Installation-EN.zip

      - name: Build OvGME packages
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          ./ovgme/build_ovgme_packages.ps1 -Version $version -OutDir .

      - name: Compute SHA256 checksums
        shell: pwsh
        run: |
          $files = "installer/dist/actual-metar.exe", "installer/dist/actual-metar-en.exe", "Instalacion-ES.zip", "Installation-EN.zip", "ActualMetar-ES-OvGME.zip", "ActualMetar-EN-OvGME.zip"
          Get-FileHash -Path $files -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path -Leaf $_.Path)" } |
            Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Create release with build assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "installer/dist/actual-metar.exe" \
            "installer/dist/actual-metar-en.exe" \
            "Instalacion-ES.zip" \
            "Installation-EN.zip" \
            "ActualMetar-ES-OvGME.zip" \
            "ActualMetar-EN-OvGME.zip" \
            "SHA256SUMS.txt" \
            --title "ACTUAL METAR ${{ github.ref_name }}" \
            --generate-notes
